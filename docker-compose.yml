version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: notification_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sno-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sno-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    container_name: sno-api-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      API_GATEWAY_PORT: 3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3001
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: "*"
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - notification-service

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.notification-service
    container_name: sno-notification-service
    restart: unless-stopped
    environment:
      PORT: 3001
      NOTIFICATION_SERVICE_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/notification_orchestrator
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  delivery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.delivery-worker
    container_name: sno-delivery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/notification_orchestrator
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    container_name: sno-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/notification_orchestrator
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

